spring.application.name=RisNaloga

# MySQL (nastavitve lahko prepišeš z okoljskimi spremenljivkami DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recipes_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:geslo}
# Hibernate samodejno ustvari/posodobi tabele glede na entitete
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Sporocila napak v JSON odgovorih
server.error.include-message=always

# Swagger (OpenAPI)
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
